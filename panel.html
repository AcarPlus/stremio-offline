<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline İndir</title>
<style>
  :root { --bg:#12101f; --card:#1c1933; --line:#2c2850; --text:#ecebf7; --dim:#9a97b8; --accent:#9d8cff; --ok:#5fd39a; --bad:#ff7a8a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 28px 16px 60px; }
  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom: 22px; }
  header img { width:44px; height:44px; }
  h1 { font-size: 22px; margin:0; flex:1; }
  .btn { background:var(--accent); color:#14102b; border:0; border-radius:9px; padding:9px 14px; font-weight:600; text-decoration:none; cursor:pointer; font-size:14px; }
  .btn.ghost { background:transparent; color:var(--dim); border:1px solid var(--line); }
  .btn.ghost:hover { color:var(--bad); border-color:var(--bad); }
  .dir { color:var(--dim); font-size:13px; margin-bottom:18px; word-break:break-all; }
  .item { display:flex; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; align-items:center; }
  .item img, .ph { width:54px; height:80px; border-radius:6px; object-fit:cover; background:var(--line); flex:none; }
  .body { flex:1; min-width:0; }
  .title { font-weight:600; }
  .file { color:var(--dim); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar { height:6px; background:var(--line); border-radius:4px; margin:8px 0 5px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); border-radius:4px; transition:width .4s; }
  .done .bar i { background:var(--ok); }
  .stat { font-size:12.5px; color:var(--dim); font-variant-numeric: tabular-nums; }
  .done .stat { color:var(--ok); }
  .empty { color:var(--dim); text-align:center; padding:50px 0; border:1px dashed var(--line); border-radius:12px; }
  .acts { display:flex; flex-direction:column; gap:6px; flex:none; }
</style>
</head>
<body>
<main>
  <header>
    <img src="/logo.svg" alt="">
    <h1>Offline İndir</h1>
    <a class="btn" id="install">Stremio'ya kur</a>
  </header>
  <div class="dir" id="dir"></div>
  <div id="list"></div>
</main>
<script>
const fmt = n => n > 1e9 ? (n/1e9).toFixed(2)+' GB' : (n/1e6).toFixed(0)+' MB'
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
// stremio://host/... biçimi portu atıp https'e çevirdiği için eklenti adresini parametre olarak veriyoruz.
document.getElementById('install').href = 'stremio:///addons?addon=' + encodeURIComponent('http://127.0.0.1:' + location.port + '/manifest.json')

async function load () {
  const r = await fetch('/api/items').then(r => r.json()).catch(() => null)
  if (!r) return
  const s = r.summary
  document.getElementById('dir').textContent = 'İndirme klasörü: ' + s.downloadDir + ' · kullanılan ' + fmt(s.usedBytes) + (s.diskFreeBytes != null ? ' · boş ' + fmt(s.diskFreeBytes) : '') + (s.engine.ready ? '' : ' · motor hazır değil')
  const list = document.getElementById('list')
  if (!r.items.length) {
    list.innerHTML = '<div class="empty">Henüz indirme yok. Stremio’da bir başlık açıp <b>⬇ İndir+Oynat</b> satırına tıkla.</div>'
    return
  }
  const eta = n => n == null ? '' : n > 3600 ? Math.floor(n/3600) + ' sa ' + Math.floor(n%3600/60) + ' dk' : n > 60 ? Math.floor(n/60) + ' dk ' + (n%60) + ' sn' : n + ' sn'
  list.innerHTML = r.items.map(e => {
    const pct = Math.floor(e.percent)
    const done = e.state === 'completed'
    const files = e.files.filter(f => f.selected)
    const ep = files.length > 1 ? files.length + ' dosya' : (files[0] && files[0].season != null ? 'S' + String(files[0].season).padStart(2,'0') + 'E' + String(files[0].episode).padStart(2,'0') : '')
    const stat = done ? '✔ Hazır · internetsiz oynar · ' + fmt(e.sizeBytes)
      : e.state === 'error' ? '✖ ' + esc(e.error)
      : e.state === 'resolving' ? 'Torrent bilgisi alınıyor…'
      : e.state === 'paused' ? '⏸ Duraklatıldı · %' + pct + ' · ' + fmt(e.doneBytes) + ' / ' + fmt(e.sizeBytes)
      : '%' + pct + ' · ' + fmt(e.doneBytes) + ' / ' + fmt(e.sizeBytes) + ' · ' + (e.downloadSpeed/1048576).toFixed(1) + ' MB/sn · ' + e.peers + ' kaynak' + (e.eta != null ? ' · kalan ' + eta(e.eta) : '')
    const act = done ? '' : (e.state === 'paused' || e.state === 'error') ? '<button class="btn" data-act="resume" data-id="' + e.id + '">Sürdür</button>' : '<button class="btn" data-act="pause" data-id="' + e.id + '">Duraklat</button>'
    return '<div class="item ' + (done ? 'done' : '') + '">' +
      (e.poster ? '<img src="' + esc(e.poster) + '" alt="">' : '<div class="ph"></div>') +
      '<div class="body"><div class="title">' + esc(e.displayName || e.name) + ' ' + esc(ep) + '</div>' +
      '<div class="file">' + esc(files.length === 1 ? files[0].name : e.name) + '</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div><div class="stat">' + stat + '</div></div>' +
      '<div class="acts">' + act + '<button class="btn ghost" data-act="delete" data-id="' + e.id + '">Sil</button></div></div>'
  }).join('')
}

document.getElementById('list').addEventListener('click', async ev => {
  const { act, id } = ev.target.dataset || {}
  if (!act || !id) return
  if (act === 'delete' && !confirm('Bu indirme ve dosyaları silinsin mi?')) return
  await fetch('/api/items/' + id + '/' + act, { method: 'POST' })
  load()
})

load()
setInterval(load, 2000)
</script>
</body>
</html>
